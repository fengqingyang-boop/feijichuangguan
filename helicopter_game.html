<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直升机横板冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            display: block;
            border-radius: 10px;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            z-index: 10;
        }

        #uiOverlay.hidden {
            display: none;
        }

        .screen {
            text-align: center;
            color: white;
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #FF6B6B;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .instruction {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            border: none;
            color: white;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 107, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        #rescueNumber {
            font-size: 5rem;
            font-weight: bold;
            color: #FFD700;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        #rescueInput {
            width: 70px;
            height: 70px;
            font-size: 2.5rem;
            text-align: center;
            border: 3px solid #FFD700;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            margin: 15px 0;
            outline: none;
        }

        #rescueInput:focus {
            border-color: #FF6B6B;
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.5);
        }

        #rescueMessage {
            font-size: 1rem;
            margin-top: 8px;
            min-height: 22px;
            font-weight: bold;
        }

        #scoreDisplay {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            z-index: 5;
        }

        #finalScore {
            font-size: 1.8rem;
            color: #FFD700;
            margin: 18px 0;
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            z-index: 5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="scoreDisplay">得分: <span id="score">0</span></div>
        <div id="hint">按住鼠标左键提升高度 | 松开下落</div>
        <div id="uiOverlay">
            <div id="startScreen" class="screen active">
                <h1>🚁 直升机横板冒险</h1>
                <p>控制你的直升机穿越障碍物！</p>
                <div class="instruction">
                    <p>🎮 按住鼠标左键提升高度</p>
                    <p>⚠️ 松开鼠标左键飞机会下落</p>
                    <p>💥 碰撞后输入数字相加进位可继续</p>
                    <p style="margin-top: 10px; color: #FFD700;">例：显示 5，输入 6 → 5+6=11 ✓ 进位成功</p>
                </div>
                <button id="startBtn">开始游戏</button>
            </div>
            
            <div id="gameOverScreen" class="screen">
                <h2>游戏结束</h2>
                <div id="finalScore">最终得分: 0</div>
                <p>真可惜！再试一次吧！</p>
                <button id="restartBtn">重新开始</button>
            </div>
            
            <div id="rescueScreen" class="screen">
                <h2>⚠️ 紧急救援</h2>
                <p>直升机受损！输入数字救援！</p>
                <p>输入的数字与屏幕数字相加<strong>必须进位</strong></p>
                <div id="rescueNumber">0</div>
                <input type="number" id="rescueInput" min="0" max="9" placeholder="?" autocomplete="off">
                <div id="rescueMessage"></div>
                <div style="margin-top: 10px;">
                    <button id="rescueBtn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        var CONFIG = {
            canvasWidth: 800,
            canvasHeight: 500,
            gravity: 0.35,
            lift: -0.7,
            helicopterX: 150,
            helicopterWidth: 50,
            helicopterHeight: 25,
            obstacleSpeed: 3.5,
            obstacleGap: 160,
            obstacleWidth: 70,
            obstacleMinHeight: 80,
            obstacleMaxHeight: 280,
            obstacleSpawnInterval: 120
        };

        // 游戏状态
        var GameState = {
            START: 'start',
            PLAYING: 'playing',
            RESCUE: 'rescue',
            GAMEOVER: 'gameover'
        };

        // 游戏变量
        var canvas, ctx;
        var gameState = GameState.START;
        var helicopter = {
            x: CONFIG.helicopterX,
            y: CONFIG.canvasHeight / 2,
            width: CONFIG.helicopterWidth,
            height: CONFIG.helicopterHeight,
            velocity: 0
        };
        var obstacles = [];
        var score = 0;
        var frameCount = 0;
        var isLifting = false;
        var rescueNumber = 0;
        var clouds = [];
        var backgroundOffset = 0;

        // 初始化云朵
        function initClouds() {
            clouds = [];
            for (var i = 0; i < 6; i++) {
                clouds.push({
                    x: Math.random() * CONFIG.canvasWidth,
                    y: 30 + Math.random() * 120,
                    width: 60 + Math.random() * 50,
                    height: 25 + Math.random() * 15
                });
            }
        }

        // 绘制天空背景
        function drawBackground() {
            var gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.canvasHeight);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.6, '#B0E0E6');
            gradient.addColorStop(1, '#98FB98');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
            
            // 绘制地面
            ctx.fillStyle = '#7CB342';
            ctx.fillRect(0, CONFIG.canvasHeight - 30, CONFIG.canvasWidth, 30);
            
            // 地面纹理
            ctx.fillStyle = '#689F38';
            for (var i = 0; i < CONFIG.canvasWidth; i += 40) {
                var offset = (backgroundOffset * 0.5 + i) % 40;
                ctx.fillRect(i - offset, CONFIG.canvasHeight - 25, 20, 3);
            }
        }

        // 绘制云朵
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            for (var i = 0; i < clouds.length; i++) {
                var cloud = clouds[i];
                var x = cloud.x - backgroundOffset * 0.2;
                var adjustedX = ((x % (CONFIG.canvasWidth + cloud.width)) + CONFIG.canvasWidth + cloud.width) % (CONFIG.canvasWidth + cloud.width) - cloud.width;
                
                ctx.beginPath();
                ctx.ellipse(adjustedX, cloud.y, cloud.width / 2, cloud.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(adjustedX + cloud.width * 0.3, cloud.y + cloud.height * 0.2, cloud.width * 0.35, cloud.height * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 绘制直升机
        function drawHelicopter() {
            ctx.save();
            ctx.translate(helicopter.x, helicopter.y);
            
            var angle = Math.max(-0.3, Math.min(0.3, helicopter.velocity * 0.03));
            ctx.rotate(angle);
            
            // 机身
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(-helicopter.width / 2, -helicopter.height / 2, helicopter.width, helicopter.height);
            
            // 机身边缘
            ctx.strokeStyle = '#1B5E20';
            ctx.lineWidth = 2;
            ctx.strokeRect(-helicopter.width / 2, -helicopter.height / 2, helicopter.width, helicopter.height);
            
            // 驾驶舱
            ctx.fillStyle = '#1976D2';
            ctx.fillRect(5, -helicopter.height / 2 + 3, 18, helicopter.height - 6);
            
            // 驾驶舱玻璃
            ctx.fillStyle = '#64B5F6';
            ctx.fillRect(7, -helicopter.height / 2 + 5, 14, helicopter.height - 10);
            
            // 尾部
            ctx.fillStyle = '#388E3C';
            ctx.fillRect(-helicopter.width / 2 - 18, -4, 20, 8);
            
            // 尾翼
            ctx.fillStyle = '#43A047';
            ctx.beginPath();
            ctx.moveTo(-helicopter.width / 2 - 18, -4);
            ctx.lineTo(-helicopter.width / 2 - 18, -12);
            ctx.lineTo(-helicopter.width / 2 - 10, -4);
            ctx.fill();
            
            // 主旋翼轴
            ctx.fillStyle = '#424242';
            ctx.fillRect(-5, -helicopter.height / 2 - 8, 10, 8);
            
            // 主旋翼（动画效果）
            var rotorAngle = (frameCount * 0.4) % (Math.PI * 2);
            ctx.save();
            ctx.translate(0, -helicopter.height / 2 - 8);
            ctx.rotate(rotorAngle);
            ctx.fillStyle = 'rgba(66, 66, 66, 0.6)';
            ctx.fillRect(-35, -2, 70, 4);
            ctx.restore();
            
            // 尾旋翼
            var tailRotorAngle = (frameCount * 0.6) % (Math.PI * 2);
            ctx.save();
            ctx.translate(-helicopter.width / 2 - 15, 0);
            ctx.rotate(tailRotorAngle);
            ctx.fillStyle = 'rgba(66, 66, 66, 0.7)';
            ctx.fillRect(-8, -1, 16, 2);
            ctx.restore();
            
            ctx.restore();
        }

        // 绘制障碍物
        function drawObstacle(obstacle) {
            var isColliding = obstacle.isColliding;
            
            // 上方障碍物
            ctx.fillStyle = isColliding ? '#FF5722' : '#558B2F';
            ctx.fillRect(obstacle.x, 0, obstacle.width, obstacle.topHeight);
            
            // 上方障碍物边缘
            ctx.fillStyle = isColliding ? '#E64A19' : '#33691E';
            ctx.fillRect(obstacle.x, obstacle.topHeight - 15, obstacle.width, 15);
            
            // 上方障碍物顶部边框
            ctx.strokeStyle = isColliding ? '#BF360C' : '#1B5E20';
            ctx.lineWidth = 3;
            ctx.strokeRect(obstacle.x, 0, obstacle.width, obstacle.topHeight);
            
            // 下方障碍物
            var bottomY = obstacle.topHeight + CONFIG.obstacleGap;
            ctx.fillStyle = isColliding ? '#FF5722' : '#558B2F';
            ctx.fillRect(obstacle.x, bottomY, obstacle.width, CONFIG.canvasHeight - bottomY);
            
            // 下方障碍物边缘
            ctx.fillStyle = isColliding ? '#E64A19' : '#33691E';
            ctx.fillRect(obstacle.x, bottomY, obstacle.width, 15);
            
            // 下方障碍物底部边框
            ctx.strokeStyle = isColliding ? '#BF360C' : '#1B5E20';
            ctx.lineWidth = 3;
            ctx.strokeRect(obstacle.x, bottomY, obstacle.width, CONFIG.canvasHeight - bottomY);
            
            // 障碍物标记
            ctx.fillStyle = isColliding ? '#FFCCBC' : '#AED581';
            for (var i = 0; i < 3; i++) {
                var stripeY = i * 35;
                if (stripeY < obstacle.topHeight - 15) {
                    ctx.fillRect(obstacle.x + 5, stripeY + 5, obstacle.width - 10, 4);
                }
            }
        }

        // 碰撞检测
        function checkCollision() {
            // 检查边界碰撞
            if (helicopter.y - helicopter.height / 2 < 0 || 
                helicopter.y + helicopter.height / 2 > CONFIG.canvasHeight - 30) {
                return true;
            }
            
            // 检查障碍物碰撞
            for (var i = 0; i < obstacles.length; i++) {
                var obstacle = obstacles[i];
                obstacle.isColliding = false;
                
                // 直升机碰撞边界（稍微缩小碰撞箱）
                var heliLeft = helicopter.x - helicopter.width / 2 + 8;
                var heliRight = helicopter.x + helicopter.width / 2 - 8;
                var heliTop = helicopter.y - helicopter.height / 2 + 4;
                var heliBottom = helicopter.y + helicopter.height / 2 - 4;
                
                // 上方障碍物碰撞
                if (heliRight > obstacle.x && 
                    heliLeft < obstacle.x + obstacle.width &&
                    heliTop < obstacle.topHeight) {
                    obstacle.isColliding = true;
                    return true;
                }
                
                // 下方障碍物碰撞
                var bottomY = obstacle.topHeight + CONFIG.obstacleGap;
                if (heliRight > obstacle.x && 
                    heliLeft < obstacle.x + obstacle.width &&
                    heliBottom > bottomY) {
                    obstacle.isColliding = true;
                    return true;
                }
            }
            
            return false;
        }

        // 生成障碍物
        function spawnObstacle() {
            var availableHeight = CONFIG.canvasHeight - 30 - CONFIG.obstacleGap - 40;
            var topHeight = CONFIG.obstacleMinHeight + Math.random() * Math.min(availableHeight, CONFIG.obstacleMaxHeight - CONFIG.obstacleMinHeight);
            
            obstacles.push({
                x: CONFIG.canvasWidth,
                width: CONFIG.obstacleWidth,
                topHeight: Math.max(40, Math.min(topHeight, CONFIG.canvasHeight - 30 - CONFIG.obstacleGap - 40)),
                passed: false,
                isColliding: false
            });
        }

        // 更新游戏状态
        function updateGame() {
            if (gameState !== GameState.PLAYING) return;
            
            frameCount++;
            backgroundOffset += CONFIG.obstacleSpeed;
            
            // 更新直升机物理
            if (isLifting) {
                helicopter.velocity += CONFIG.lift;
            } else {
                helicopter.velocity += CONFIG.gravity;
            }
            
            // 限制速度
            helicopter.velocity = Math.max(-7, Math.min(7, helicopter.velocity));
            
            // 更新位置
            helicopter.y += helicopter.velocity;
            
            // 生成障碍物
            if (frameCount % CONFIG.obstacleSpawnInterval === 0) {
                spawnObstacle();
            }
            
            // 更新障碍物位置
            for (var i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= CONFIG.obstacleSpeed;
            }
            
            // 移除屏幕外的障碍物并加分
            var newObstacles = [];
            for (var j = 0; j < obstacles.length; j++) {
                var obstacle = obstacles[j];
                if (obstacle.x + obstacle.width < helicopter.x - helicopter.width / 2 && !obstacle.passed) {
                    obstacle.passed = true;
                    score++;
                    document.getElementById('score').textContent = score;
                }
                if (obstacle.x + obstacle.width > -100) {
                    newObstacles.push(obstacle);
                }
            }
            obstacles = newObstacles;
            
            // 碰撞检测
            if (checkCollision()) {
                enterRescueMode();
            }
        }

        // 渲染游戏
        function render() {
            // 清空画布
            ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
            
            // 绘制背景
            drawBackground();
            
            // 绘制云朵
            drawClouds();
            
            // 绘制障碍物
            for (var i = 0; i < obstacles.length; i++) {
                drawObstacle(obstacles[i]);
            }
            
            // 绘制直升机（在所有状态下都显示，除了游戏结束）
            if (gameState !== GameState.GAMEOVER) {
                drawHelicopter();
            }
        }

        // 游戏主循环
        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        // 显示特定屏幕
        function showScreen(screenId) {
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active');
            }
            
            var targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            }
            
            var uiOverlay = document.getElementById('uiOverlay');
            if (screenId === 'playingScreen') {
                uiOverlay.classList.add('hidden');
            } else {
                uiOverlay.classList.remove('hidden');
            }
        }

        // 进入救援模式
        function enterRescueMode() {
            gameState = GameState.RESCUE;
            rescueNumber = Math.floor(Math.random() * 9) + 1; // 1-9
            document.getElementById('rescueNumber').textContent = rescueNumber;
            document.getElementById('rescueInput').value = '';
            document.getElementById('rescueMessage').textContent = '';
            document.getElementById('rescueMessage').style.color = '';
            
            showScreen('rescueScreen');
            
            // 延迟聚焦输入框
            setTimeout(function() {
                document.getElementById('rescueInput').focus();
            }, 100);
        }

        // 检查救援是否成功
        function checkRescue() {
            var inputElement = document.getElementById('rescueInput');
            var inputValue = inputElement.value.trim();
            var input = parseInt(inputValue);
            
            var messageElement = document.getElementById('rescueMessage');
            
            if (inputValue === '' || isNaN(input) || input < 0 || input > 9) {
                messageElement.textContent = '请输入0-9之间的数字！';
                messageElement.style.color = '#FF6B6B';
                inputElement.focus();
                return;
            }
            
            var sum = rescueNumber + input;
            var canCarry = sum >= 10;
            
            if (canCarry) {
                // 救援成功
                messageElement.textContent = rescueNumber + ' + ' + input + ' = ' + sum + '，进位成功！直升机修复！';
                messageElement.style.color = '#4CAF50';
                
                // 清除障碍物，重置位置
                setTimeout(function() {
                    obstacles = [];
                    helicopter.y = CONFIG.canvasHeight / 2;
                    helicopter.velocity = 0;
                    gameState = GameState.PLAYING;
                    showScreen('playingScreen');
                }, 1500);
            } else {
                // 救援失败
                messageElement.textContent = rescueNumber + ' + ' + input + ' = ' + sum + '，无法进位！直升机坠毁...';
                messageElement.style.color = '#FF6B6B';
                
                setTimeout(function() {
                    gameOver();
                }, 1500);
            }
        }

        // 游戏结束
        function gameOver() {
            gameState = GameState.GAMEOVER;
            document.getElementById('finalScore').textContent = '最终得分: ' + score;
            showScreen('gameOverScreen');
        }

        // 开始游戏
        function startGame() {
            gameState = GameState.PLAYING;
            score = 0;
            frameCount = 0;
            obstacles = [];
            helicopter.y = CONFIG.canvasHeight / 2;
            helicopter.velocity = 0;
            backgroundOffset = 0;
            
            document.getElementById('score').textContent = score;
            showScreen('playingScreen');
        }

        // 初始化游戏
        function init() {
            console.log('游戏初始化开始...');
            
            canvas = document.getElementById('gameCanvas');
            if (!canvas) {
                console.error('找不到canvas元素！');
                alert('游戏初始化失败：找不到canvas元素');
                return;
            }
            
            ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('无法获取2D上下文！');
                alert('游戏初始化失败：无法获取Canvas上下文');
                return;
            }
            
            console.log('Canvas和上下文初始化成功');
            
            initClouds();
            console.log('云朵初始化成功');
            
            // 事件监听 - 鼠标事件
            canvas.addEventListener('mousedown', function(e) {
                console.log('鼠标按下，当前状态:', gameState);
                if (gameState === GameState.PLAYING) {
                    isLifting = true;
                    console.log('开始提升');
                }
            });
            
            canvas.addEventListener('mouseup', function() {
                console.log('鼠标松开');
                isLifting = false;
            });
            
            canvas.addEventListener('mouseleave', function() {
                console.log('鼠标离开');
                isLifting = false;
            });
            
            // 触摸事件支持
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                console.log('触摸开始，当前状态:', gameState);
                if (gameState === GameState.PLAYING) {
                    isLifting = true;
                    console.log('开始提升（触摸）');
                }
            });
            
            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                console.log('触摸结束');
                isLifting = false;
            });
            
            // 按钮事件
            var startBtn = document.getElementById('startBtn');
            var restartBtn = document.getElementById('restartBtn');
            var rescueBtn = document.getElementById('rescueBtn');
            var rescueInput = document.getElementById('rescueInput');
            
            if (startBtn) {
                startBtn.addEventListener('click', function() {
                    console.log('开始按钮点击');
                    startGame();
                });
                console.log('开始按钮事件绑定成功');
            } else {
                console.error('找不到开始按钮！');
            }
            
            if (restartBtn) {
                restartBtn.addEventListener('click', function() {
                    console.log('重新开始按钮点击');
                    startGame();
                });
                console.log('重新开始按钮事件绑定成功');
            }
            
            if (rescueBtn) {
                rescueBtn.addEventListener('click', function() {
                    console.log('救援按钮点击');
                    checkRescue();
                });
                console.log('救援按钮事件绑定成功');
            }
            
            if (rescueInput) {
                rescueInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        console.log('救援输入回车');
                        checkRescue();
                    }
                });
                console.log('救援输入事件绑定成功');
            }
            
            // 确保初始状态正确
            showScreen('startScreen');
            console.log('初始屏幕设置为开始屏幕');
            
            // 开始游戏循环
            console.log('开始游戏循环');
            gameLoop();
            
            console.log('游戏初始化完成！');
        }

        // 页面加载完成后初始化
        console.log('等待页面加载...');
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            console.log('页面已加载，立即初始化');
            init();
        } else {
            console.log('页面未加载，等待load事件');
            window.addEventListener('load', function() {
                console.log('页面加载完成，开始初始化');
                init();
            });
            
            // 备用：DOMContentLoaded
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM加载完成，开始初始化');
                init();
            });
        }
    </script>
</body>
</html>
